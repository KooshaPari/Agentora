[workspace]
resolver = "2"
# `agents/phenoagent/{phenotype-daemon,phenotype-skills}` are
# legacy duplicates of `crates/pheno-agent/{phenotype-daemon,phenotype-skills}`.
# The canonical daemon lives at KooshaPari/PhenoAgent (see plan:
# PHENO_AGENT_RECONCILIATION_PLAN §2). Excluded here to allow the
# 7 `crates/` members to be registered without a name collision.
# A follow-up PR will `git rm` the `agents/phenoagent/` copies.
exclude = [
    "agents/phenoagent/phenotype-daemon",
    "agents/phenoagent/phenotype-skills",
    # W18b: staging stubs — git-pinned audit copies, not workspace members
    "crates/phenotype-errors",
    "crates/phenotype-error-macros",
    "crates/phenotype-config-loader",
]
members = [
    "rust/phenotype-agent-contracts",
    "crates/pheno-agent/phenotype-daemon",
    "crates/pheno-agent/phenotype-skills",
    "crates/pheno-proc-runtime/pheno-proc-core",
    "crates/pheno-proc-runtime/pheno-proc-shm",
    "crates/pheno-proc-runtime/pheno-proc-queue",
    "crates/pheno-proc-runtime/pheno-proc-uds",
    "crates/pheno-proc-runtime/pheno-proc-dedup",
    # PhenoProc wave 5–6 stubs (full phenotype-* staging: see crates/ABSORPTION_MANIFEST.md)
    "crates/bifrost-routing",
    "crates/forgecode-core",
]
[workspace.package]

rust-version = "1.75"

[package]
name = "agentkit"
version = "0.1.0"
edition = "2021"
authors = ["Phenotype Engineering"]
description = "Agent framework with skill system and tool registry"
license = "Apache-2.0"
repository = "https://github.com/KooshaPari/Agentora"
documentation = "https://docs.rs/agentkit"
keywords = ["agent", "ai", "framework", "skills", "tools"]
categories = ["artificial-intelligence", "development-tools"]

# Crate-wide lints. Centralized here (SOTA) so a single edit changes the
# policy for the whole crate. CI runs `cargo clippy -- -D warnings` to
# enforce these. `missing_docs = "warn"` is intentionally deferred —
# several pub items still need `///` docs; flipping it on now would
# break `-D warnings`. See API_CONTRACT_AUDIT.md.
[lints.rust]
unsafe_code = "forbid"

# Lint levels belong in Cargo's stable `[lints]` table. Keep the broad groups
# at lower priority so the documented, narrow exceptions below win without
# suppressing the rest of the policy.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }

[dependencies]
# Core domain
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Application
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1"

# CLI surface (L15): clap with derive so the binary stays declarative and
# downstream consumers can extend the subcommand tree without manual parser
# wiring.
clap = { version = "4", features = ["derive"] }

# LLM support (optional)
reqwest = { version = "0.13", features = ["json"], optional = true }

# Memory backends (optional)
redis = { version = "1.2", optional = true }
rusqlite = { version = "0.40", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4"] }
substrate = { git = "https://github.com/KooshaPari/substrate", rev = "ce90e8a563b7b1939ef2deeae6041ae902963e86" }

[dev-dependencies]
proptest = "1.0"
tokio-test = "0.4"
mockall = "0.15"
# Integration tests exercise the same pinned CLI extension used by the daemon.
# Keep the git revision immutable so cargo-deny can verify repository provenance.
clap-ext = { git = "https://github.com/KooshaPari/clap-ext", rev = "05f6927bfd5477fafebfdc0166a7578ff154f0bf" }

[features]
default = []
openai = ["reqwest"]
redis-memory = ["redis"]
sqlite-memory = ["rusqlite"]

[[bin]]
name = "agentkit"
path = "src/bin/main.rs"

[lib]
name = "agentkit"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true

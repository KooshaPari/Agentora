name: CI concurrency:   group: ${{ github.workflow }}-${{ github.ref }}   cancel-in-progress: true   on:   push:     branches: [main]   pull_request:     branches: [main]  permissions:   contents: read  env:   CARGO_TERM_COLOR: always  jobs:   build:     name: Build     runs-on: ubuntu-24.04     steps:       - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2       - name: Install Rust         uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.91.0       - name: Cache dependencies         uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2       - name: Build         run: cargo build --workspace --verbose    clippy:     name: Clippy     runs-on: ubuntu-24.04     steps:       - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2       - name: Install Rust         uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.91.0         with:           components: clippy       - name: Cache dependencies         uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2       - name: Clippy         run: cargo clippy --workspace --all-targets -- -D warnings    test:     name: Test Suite     runs-on: ubuntu-24.04     steps:       - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2       - name: Install Rust         uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.91.0       - name: Cache dependencies         uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2       - name: Run tests         run: cargo test --workspace --verbose    fmt:     name: Formatting     runs-on: ubuntu-24.04     steps:       - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2       - name: Install Rust         uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.91.0         with:           components: rustfmt       - name: Check formatting         run: cargo fmt --all -- 
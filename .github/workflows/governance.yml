name: Governance

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-audit:
    name: Governance file audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required governance artifacts
        run: |
          set -euo pipefail
          test -f SECURITY.md            || { echo "::error::Missing SECURITY.md"; exit 1; }
          test -f CODEOWNERS             || { echo "::error::Missing CODEOWNERS"; exit 1; }
          test -f .editorconfig          || { echo "::error::Missing .editorconfig"; exit 1; }
          test -f .github/dependabot.yml || { echo "::error::Missing .github/dependabot.yml"; exit 1; }
          test -f cliff.toml             || { echo "::error::Missing cliff.toml"; exit 1; }
          test -f CHANGELOG.md           || { echo "::warning::Missing CHANGELOG.md"; }
          echo "All required governance files present."

      - name: Verify root package license metadata
        run: |
          set -euo pipefail
          package_license="$(sed -n 's/^license = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$package_license" != "Apache-2.0" ]; then
            echo "::error file=Cargo.toml::Expected root package license Apache-2.0, found '$package_license'"
            exit 1
          fi
          for identity_file in AGENTS.md CLAUDE.md CITATION.cff ORIGIN.md; do
            if grep -Fq "MIT OR Apache-2.0" "$identity_file"; then
              echo "::error file=$identity_file::Stale dual-license declaration conflicts with Cargo.toml"
              exit 1
            fi
            if ! grep -Fq "Apache-2.0" "$identity_file"; then
              echo "::error file=$identity_file::Missing Apache-2.0 package license declaration"
              exit 1
            fi
          done
          echo "Root package license metadata is consistent: Apache-2.0"

      - name: git-cliff dry-run (best-effort)
        run: |
          if command -v git-cliff >/dev/null 2>&1; then
            git-cliff --dry-run || echo "git-cliff dry-run failed (non-fatal)"
          else
            echo "git-cliff not installed; skipping"
          fi

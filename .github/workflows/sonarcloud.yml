name: SonarCloud
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - name: Load Sonar token from Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || 'prod' }}
        run: |
          set -euo pipefail
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::INFISICAL_TOKEN secret not configured in repo settings"
            exit 1
          fi
          curl --proto '=https' --tlsv1.2 -1sLf "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" | sudo -E bash
          sudo apt-get install -y infisical
          sonar_token="$(infisical --silent run \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            -- bash -c "printf '%s' \"\$SONAR_TOKEN\"")"
          if [ -z "$sonar_token" ]; then
            echo "::error::SONAR_TOKEN not found in configured Infisical environment"
            exit 1
          fi
          echo "::add-mask::$sonar_token"
          printf 'SONAR_TOKEN=%s\n' "$sonar_token" >> "$GITHUB_ENV"
          unset sonar_token
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}

# Pull secrets from Infisical into CI
# Requires: INFISICAL_TOKEN (machine identity service token) stored in repo secrets
# Docs: https://infisical.com/docs/cli/usage

name: Infisical Sync

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/infisical.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: infisical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-secrets:
    name: Pull secrets from Infisical
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install verified Infisical CLI
        env:
          INFISICAL_CLI_VERSION: "0.43.114"
          INFISICAL_CLI_SHA256: "c35cdd1c4908b3ea6c0773279f8ae6993f9ec03b5e2d4a7cdc2f38ce89eb33d0"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/infisical-cli-${INFISICAL_CLI_VERSION}-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/infisical-cli"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/Infisical/cli/releases/download/v${INFISICAL_CLI_VERSION}/cli_${INFISICAL_CLI_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$INFISICAL_CLI_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" infisical
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Pull secrets to .env
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
        run: |
          # Validate required secrets are present
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::INFISICAL_TOKEN secret not configured in repo settings"
            exit 1
          fi
          if [ -z "$INFISICAL_PROJECT_ID" ]; then
            echo "::error::INFISICAL_PROJECT_ID var or secret not set"
            exit 1
          fi

          # Pull all secrets from the configured env into .env
          infisical run \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            -- bash -c 'echo "Secrets loaded into the isolated process environment"'

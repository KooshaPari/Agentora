name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 09:00 PDT cron (ADR-042 cadence)
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sbom:
    name: SBOM generation (CycloneDX)
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.subjects.outputs.base64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          output-file: sbom-cyclonedx.json
      - name: Create SLSA subjects digest
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          sha256sum sbom-cyclonedx.json > subjects.sha256
          echo "base64=$(base64 --wrap=0 subjects.sha256)" >> "$GITHUB_OUTPUT"
          rm subjects.sha256
        continue-on-error: true

  slsa-provenance:
    name: SLSA Build Level 3 provenance
    needs: [codeql, dependency-audit, gitleaks, sbom]
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sbom.outputs.subjects }}

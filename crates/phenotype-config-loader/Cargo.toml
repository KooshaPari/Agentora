[package]
name = "phenotype-config-loader"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Configuration loading utilities for Phenotype"
repository = "https://github.com/KooshaPari/phenotype-config"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"
thiserror = "2.0"
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"

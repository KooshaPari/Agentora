[package]
name = "forgecode-core"
version = "0.1.0"
edition = "2021"
description = "Forgecode agent/provider stubs (PhenoProc absorption)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

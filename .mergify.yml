# Mergify Configuration — Optimized for multi-language monorepos
# Docs: https://docs.mergify.com/

pull_request_rules:
  # Kill Mergify-bot regression loop: the mergify[bot] periodically force-pushes
  # to `mergify/configuration-deprecated-update` to "upgrade" config. The PRs are
  # no-op (branch is byte-identical to main). Auto-close + auto-delete-branch on sight.
  - name: Kill mergify/configuration-deprecated-update regression
    conditions:
      - base=main
      - head~=^mergify/configuration-deprecated-update$
      - -closed
    actions:
      comment:
        message: >
          Auto-closing: this is a Mergify[bot] regression (the bot force-pushes
          the deprecated-config branch on a schedule). Branch is byte-identical
          to main; no unique work. Closed by the kill-loop rule in `.mergify.yml`.
      close: {}

  # Auto-merge only after the branch-protection checks and a human review pass.
  - name: Auto-merge when approved + CI green
    conditions:
      - "#review-requested = 0"
      - "#approved-reviews-by >= 1"
      - "check-success = ci / lint"
      - "check-success = ci / test"
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})

          Co-authored-by: {{ author }}

  # Label PRs based on changed files
  - name: Label Python changes
    conditions:
      - files~=\.py$
    actions:
      label:
        add:
          - python

  - name: Label Rust changes
    conditions:
      - files~=\.rs$|Cargo\.
    actions:
      label:
        add:
          - rust

  - name: Label Go changes
    conditions:
      - files~=\.go$|go\.
    actions:
      label:
        add:
          - go

  - name: Label TypeScript changes
    conditions:
      - files~=\.ts$|\.tsx$|package\.json
    actions:
      label:
        add:
          - typescript

  # Warn on large PRs
  - name: Warn on large PRs
    conditions:
      - -closed
      - -draft
      - "#files>20"
    actions:
      comment:
        message: >
          **Large PR Alert**: This PR touches {{ number }} files.
          Consider splitting into smaller PRs for easier review.

  # Add ready-to-merge label when all checks pass
  - name: Add ready-to-merge label
    conditions:
      - -closed
      - -draft
      - check-success=ci
      - check-success=lint
      - check-success=test
      - "#approved-reviews-by>=1"
    actions:
      label:
        add:
          - ready-to-merge

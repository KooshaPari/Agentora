[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
]

[advisories]
db-path = "$CARGO_HOME/advisory-db"

ignore = [
    # bincode 1.x is unmaintained (RUSTSEC-2025-0141); pulled transitively by
    # phenotype-daemon's optional tokio-unix-ipc serde feature. No patched 1.x
    # release exists and tokio-unix-ipc 0.4.0 is the latest on crates.io.
    { id = "RUSTSEC-2025-0141", reason = "transitive unmaintained bincode via phenotype-daemon -> tokio-unix-ipc; no upgrade path" },
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/KooshaPari/substrate",
]
